<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2a47d1">
<title>Mizani</title>
<style>
:root{--ink:#1c2333;--paper:#f2f4f9;--surface:#fff;--line:#dce1ec;--muted:#5b647a;--accent:#2a47d1;--accent-ink:#fff;--good:#157a4a;--good-bg:#e4f4ec;--warn:#9a5b00;--warn-bg:#fdf1dc;--bad:#b3261e;--bad-bg:#fbe8e6;--r:8px}
@media (prefers-color-scheme:dark){:root{--ink:#e7eaf3;--paper:#11141c;--surface:#1a1f2e;--line:#2b3247;--muted:#97a0b6;--accent:#8aa0ff;--accent-ink:#0b1030;--good:#55c78d;--good-bg:#13281f;--warn:#e3a847;--warn-bg:#2d2411;--bad:#ff8f86;--bad-bg:#32181a}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0 0 .5rem;line-height:1.2}h2{font-size:1.25rem}h3{font-size:1rem}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}.small{font-size:.85rem}
.btn{border:1px solid var(--line);background:var(--surface);padding:.5rem .8rem;border-radius:var(--r);cursor:pointer;min-height:40px}
.btn:hover{border-color:var(--accent)}.btn:focus-visible,input:focus-visible,select:focus-visible,.strip:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.danger{color:var(--bad);border-color:var(--bad)}.btn.sm{min-height:32px;padding:.2rem .6rem}
input,select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:.5rem .6rem;min-height:40px;width:100%}
label{display:block;font-size:.85rem;color:var(--muted);margin:.5rem 0 .2rem}
table{border-collapse:collapse;width:100%}th,td{padding:.45rem .6rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-weight:600;color:var(--muted);font-size:.85rem}
tr.total td{font-weight:700;border-top:2px solid var(--ink)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 140px}.row>.fit{flex:0 0 auto}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.chip{display:inline-block;padding:.1rem .55rem;border-radius:99px;font-size:.8rem;background:var(--paper);border:1px solid var(--line)}
.chip.good{background:var(--good-bg);color:var(--good);border-color:transparent}.chip.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}.chip.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
#app{display:grid;grid-template-columns:190px 1fr;grid-template-rows:auto 1fr;min-height:100vh}
header{grid-column:1/3;display:flex;gap:1rem;align-items:center;padding:.6rem 1rem;background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.brand{font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.strip{flex:1 1 320px;display:flex;gap:.6rem;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:.35rem .9rem;cursor:pointer;text-align:left}
.strip .dot{width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}
.strip.ok{background:var(--good-bg);border-color:transparent}.strip.ok .dot{background:var(--good)}
.strip.bad{background:var(--bad-bg);border-color:var(--bad)}.strip.bad .dot{background:var(--bad)}
.strip b{font-weight:700}
nav{padding:.75rem;border-right:1px solid var(--line);background:var(--surface)}
nav button{display:block;width:100%;text-align:left;border:0;background:none;padding:.65rem .75rem;border-radius:var(--r);cursor:pointer;font-weight:500}
nav button[aria-current=true]{background:var(--accent);color:var(--accent-ink)}
main{padding:1rem;min-width:0}
.sell{display:grid;grid-template-columns:230px 1fr 340px;gap:1rem;align-items:start}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.5rem}
.item{min-height:76px;text-align:left;display:flex;flex-direction:column;justify-content:space-between}
.billrow{display:flex;justify-content:space-between;gap:.5rem;padding:.55rem .6rem;border:1px solid var(--line);border-radius:var(--r);margin-bottom:.4rem;cursor:pointer;background:var(--surface)}
.billrow[aria-current=true]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.tabs{display:flex;gap:.3rem;margin-bottom:1rem;flex-wrap:wrap}.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:.35rem .9rem;cursor:pointer}.tabs button[aria-current=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);max-width:min(520px,94vw);width:100%;padding:1.2rem}
dialog::backdrop{background:rgba(10,14,25,.5)}
#toast{position:fixed;left:50%;bottom:calc(1rem + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:50;display:grid;gap:.4rem}
.toast{background:var(--ink);color:var(--paper);padding:.6rem 1rem;border-radius:var(--r);max-width:90vw}.toast.err{background:var(--bad);color:#fff}
.auth{max-width:440px;margin:6vh auto;padding:0 1rem}.auth h1{font-size:2rem;letter-spacing:-.02em}
.scroll{overflow-x:auto}
@media (max-width:980px){.sell{grid-template-columns:1fr}}
@media (max-width:760px){#app{grid-template-columns:1fr;padding-bottom:64px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;border-top:1px solid var(--line);border-right:0;padding:.3rem;z-index:20;padding-bottom:calc(.3rem + env(safe-area-inset-bottom))}nav button{text-align:center;padding:.5rem .2rem;font-size:.8rem}header{grid-column:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="root"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
// The DOM turns arrays and false into the text "[object HTMLDivElement]" / "false". Flatten and drop empties everywhere, once.
for (const m of ['append', 'prepend', 'replaceChildren']) { const orig = Element.prototype[m]; Element.prototype[m] = function (...a) { return orig.apply(this, a.flat(9).filter((k) => k != null && k !== false)); }; }
const S = { token: null, business: '', user: null, health: null, page: 'sell', bill: null, cache: {}, outlet: localStorage.getItem('mz_outlet') || '', billTab: 'open', outlets: [] };
const $ = (s, r = document) => r.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v; else if (v === true) e.setAttribute(k, ''); else e.setAttribute(k, v);
  }
  for (const k of kids.flat(9)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(String(k)));
  return e;
}
const kes = (c) => (c / 100).toLocaleString('en-KE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const toCents = (v) => Math.round(parseFloat(String(v).replace(/,/g, '')) * 100);
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now());
function toast(msg, err) { const t = h('div', { class: 'toast' + (err ? ' err' : '') }, msg); $('#toast').append(t); setTimeout(() => t.remove(), err ? 6000 : 2800); }

async function api(method, url, body, idem) {
  const res = await fetch('/api' + url, { method, headers: { 'content-type': 'application/json', ...(S.token ? { authorization: 'Bearer ' + S.token } : {}), ...(idem ? { 'idempotency-key': idem } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401 && S.token) { signOut(); throw new Error('Please sign in again'); }
  if (!res.ok) throw Object.assign(new Error(data.error || 'Request failed'), { status: res.status, detail: data.detail });
  return data;
}
async function act(fn, ok) { try { const r = await fn(); if (ok) toast(ok); refreshHealth(); return r; } catch (e) { toast(e.message, true); } }

// ---------------------------------------------------------------- forms
function field(f) {
  let input;
  if (f.type === 'select') input = h('select', { name: f.name }, (f.options || []).map((o) => h('option', { value: o.value ?? o }, o.label ?? o)));
  else if (f.type === 'checkbox') input = h('input', { type: 'checkbox', name: f.name, style: 'width:auto;min-height:0' });
  else if (f.type === 'textarea') input = h('textarea', { name: f.name, rows: 2 });
  else input = h('input', { name: f.name, type: f.type || 'text', step: f.step, placeholder: f.placeholder, autocomplete: 'off', inputmode: f.type === 'number' ? 'decimal' : undefined });
  if (f.value !== undefined) { if (f.type === 'checkbox') input.checked = !!f.value; else input.value = f.value; }
  return h('div', {}, h('label', {}, f.label), input);
}
function form(fields, submitLabel, onSubmit) {
  const f = h('div', {}, h('div', { class: 'row' }, fields.map(field)), h('div', { style: 'margin-top:.8rem' }, h('button', { class: 'btn primary', type: 'button', onclick: async (ev) => {
    const v = {}; for (const el of f.querySelectorAll('[name]')) v[el.name] = el.type === 'checkbox' ? el.checked : el.value;
    ev.target.disabled = true; try { await onSubmit(v, f); } finally { ev.target.disabled = false; }
  } }, submitLabel)));
  return f;
}
function dialog(title, body, actions) {
  const d = h('dialog', {}, h('h3', {}, title), body, h('div', { class: 'row', style: 'margin-top:1rem;justify-content:flex-end' }, actions(() => d.close())));
  d.addEventListener('close', () => d.remove()); document.body.append(d); d.showModal(); return d;
}
async function approverFields() {
  const list = await api('GET', '/approvers');
  return [{ name: 'approver_id', label: 'Approved by', type: 'select', options: list.map((a) => ({ value: a.id, label: a.name })) }, { name: 'pin', label: 'Approver PIN', type: 'password' }];
}
const approverOf = (v) => ({ user_id: v.approver_id, pin: v.pin });
async function names() {
  const [items, stores, parties, accounts] = await Promise.all([api('GET', '/items'), api('GET', '/stores'), api('GET', '/parties'), api('GET', '/accounts')]);
  S.cache = { items, stores, parties, accounts }; return S.cache;
}
const opt = (list, label = (x) => x.name) => list.map((x) => ({ value: x.id ?? x.code, label: label(x) }));

// ---------------------------------------------------------------- shell
function signOut() { S.token = null; S.user = null; localStorage.removeItem('mz'); render(); }
function render() { const r = $('#root'); r.replaceChildren(S.token ? shell() : authView()); if (S.token) { go(S.page); refreshHealth(); loadOutlets(); } }
async function loadOutlets() { try { S.outlets = await api('GET', '/outlets'); const sel = $('#outletsel'); if (sel && S.outlets.length > 1) { sel.replaceChildren(h('option', { value: '' }, 'All outlets'), S.outlets.map((o) => h('option', { value: o.id }, o.name))); sel.value = S.outlet; sel.style.display = ''; } } catch (e) {} }
function authView() {
  let mode = 'in';
  const box = h('div', { class: 'auth' });
  const draw = () => box.replaceChildren(h('h1', {}, 'Mizani'), h('p', { class: 'muted' }, 'Restaurant and bar books that always balance.'),
    h('div', { class: 'tabs' }, h('button', { 'aria-current': mode === 'in', onclick: () => { mode = 'in'; draw(); } }, 'Sign in'), h('button', { 'aria-current': mode === 'up', onclick: () => { mode = 'up'; draw(); } }, 'Create a business')),
    mode === 'in'
      ? form([{ name: 'slug', label: 'Business address', placeholder: 'my-lounge' }, { name: 'email', label: 'Email', type: 'email' }, { name: 'password', label: 'Password', type: 'password' }], 'Sign in', async (v) => { const r = await act(() => api('POST', '/auth/login', v)); if (r) start(r); })
      : form([{ name: 'business_name', label: 'Business name' }, { name: 'slug', label: 'Business address (letters, numbers, hyphens)', placeholder: 'my-lounge' }, { name: 'owner_name', label: 'Your name' }, { name: 'email', label: 'Email', type: 'email' }, { name: 'password', label: 'Password (8+ characters)', type: 'password' }, { name: 'pin', label: 'Manager PIN (4 to 8 digits, used to approve voids and complimentary items)', type: 'password' }, { name: 'demo', label: 'Start with a sample menu', type: 'checkbox', value: true }], 'Create business', async (v) => { const r = await act(() => api('POST', '/signup', v)); if (r) start(r); }));
  draw(); const wrap = h('div', {}, box, h('div', { class: 'auth', style: 'margin-top:0' }, healthCheckView())); return wrap;
}
function start(r) { S.token = r.token; S.business = r.business; S.user = r.user; localStorage.setItem('mz', JSON.stringify({ token: r.token, business: r.business, user: r.user })); S.page = ['owner', 'manager', 'accountant'].includes(r.user.role) ? 'sell' : 'sell'; render(); }
const NAV = [['sell', 'Sell', ['owner', 'manager', 'cashier', 'waiter']], ['stock', 'Stock', ['owner', 'manager', 'storekeeper', 'accountant']], ['buy', 'Buy', ['owner', 'manager', 'storekeeper', 'accountant']], ['money', 'Money', ['owner', 'manager', 'accountant']], ['reports', 'Reports', ['owner', 'manager', 'accountant']], ['more', 'More', ['owner', 'manager', 'accountant', 'cashier']], ['setup', 'Setup', ['owner', 'manager']]];
function shell() {
  const nav = h('nav', {}, NAV.filter((n) => n[2].includes(S.user.role)).map(([id, label]) => h('button', { 'data-page': id, onclick: () => go(id) }, label)));
  const strip = h('button', { class: 'strip', id: 'strip', onclick: showHealth, 'aria-label': 'Books health' }, h('span', { class: 'dot' }), h('span', { id: 'striptext' }, 'Checking the books…'));
  return h('div', { id: 'app' }, h('header', {}, h('span', { class: 'brand' }, 'Mizani'), h('span', { class: 'muted' }, S.business), strip,
    h('select', { id: 'outletsel', style: 'width:auto;display:none', 'aria-label': 'Outlet', onchange: (e) => { S.outlet = e.target.value; localStorage.setItem('mz_outlet', S.outlet); go(S.page); } }),
    h('span', { class: 'small muted' }, `${S.user.name} · ${S.user.role}`), h('button', { class: 'btn sm', onclick: signOut }, 'Sign out')), nav, h('main', { id: 'main' }, h('div', { id: 'banner' })));
}
async function refreshHealth() {
  if (!S.token || !$('#strip')) return;
  try {
    const r = await api('GET', '/reconcile'); S.health = r;
    const s = $('#strip'); s.className = 'strip ' + (r.ok ? 'ok' : 'bad');
    $('#striptext').replaceChildren(r.ok ? h('span', {}, h('b', {}, 'Books balanced'), ` · debits ${kes(r.totals.debit)} = credits ${kes(r.totals.credit)}`) : h('span', {}, h('b', {}, 'Books need attention'), ` · ${r.checks.filter((c) => !c.ok).length} check(s) failing`));
  } catch (e) { /* offline or signed out */ }
}
function showHealth() {
  const r = S.health; if (!r) return;
  dialog('Books health', h('div', {}, h('p', { class: 'muted small' }, 'These checks run on every change and again at day end. Each one compares the ledger with the records behind it.'),
    h('table', {}, r.checks.map((c) => h('tr', {}, h('td', {}, h('span', { class: 'chip ' + (c.ok ? 'good' : 'bad') }, c.ok ? 'pass' : 'fail')), h('td', {}, c.name, !c.ok && h('div', { class: 'small', style: 'color:var(--bad)' }, c.detail)))))),
    (close) => [h('button', { class: 'btn primary', onclick: close }, 'Close')]);
}
function go(id) {
  S.page = id;
  for (const b of document.querySelectorAll('nav button')) b.setAttribute('aria-current', b.dataset.page === id);
  const m = $('#main'); m.replaceChildren(h('p', { class: 'muted' }, 'Loading…'));
  api('GET', '/billing').then((b) => { if (b.access && b.access.message) toast(b.access.message, !b.access.writable); }).catch(() => {});
  ({ sell: pageSell, stock: pageStock, buy: pageBuy, money: pageMoney, reports: pageReports, more: pageMore, setup: pageSetup })[id](m).catch((e) => m.replaceChildren(h('p', { style: 'color:var(--bad)' }, e.message)));
}
const tabs = (opts, cur, set) => h('div', { class: 'tabs' }, opts.map(([id, label]) => h('button', { 'aria-current': id === cur, onclick: () => set(id) }, label)));

// ---------------------------------------------------------------- sell
async function pageSell(m) {
  const [items, bills] = await Promise.all([api('GET', '/items?filter=sellable'), api('GET', `/bills?status=${S.billTab}&outlet=${S.outlet}`)]);
  const left = h('div', {}), mid = h('div', {}), right = h('div', { class: 'panel' });
  const reload = () => pageSell(m);
  const tableIn = h('input', { placeholder: 'Table or name' });
  left.append(h('h2', {}, 'Open bills'), h('div', { class: 'row', style: 'margin-bottom:.6rem' }, tableIn, h('button', { class: 'btn primary fit', onclick: async () => { const b = await act(() => api('POST', '/bills', { table_name: tableIn.value || null, outlet_id: S.outlet || undefined })); if (b) { S.bill = b.id; S.billTab = 'open'; reload(); } } }, 'New bill')),
    h('div', { class: 'tabs' }, [['open', 'Open'], ['closed', 'Paid']].map(([id, label]) => h('button', { 'aria-current': S.billTab === id, onclick: () => { S.billTab = id; reload(); } }, label))),
    bills.length ? bills.slice(0, 40).map((b) => h('div', { class: 'billrow', 'aria-current': S.bill === b.id, onclick: () => { S.bill = b.id; reload(); } }, h('span', {}, b.table_name || b.number), h('span', { class: 'num' }, kes(b.balance)))) : h('p', { class: 'muted' }, 'No open bills. Start one to take an order.'));
  mid.append(h('h2', {}, 'Menu'), h('div', { class: 'items' }, items.map((i) => h('button', { class: 'btn item', onclick: async () => {
    if (!S.bill) { const b = await act(() => api('POST', '/bills', { outlet_id: S.outlet || undefined })); if (!b) return; S.bill = b.id; }
    if (await act(() => api('POST', `/bills/${S.bill}/lines`, { item_id: i.id, qty: '1' }))) reload();
  } }, h('span', {}, i.name), h('span', { class: 'num muted' }, kes(i.sell_price))))));
  if (!S.bill) right.append(h('p', { class: 'muted' }, 'Pick an open bill or tap a menu item to start one.'));
  else {
    const b = await api('GET', `/bills/${S.bill}`).catch(() => null);
    if (!b) { S.bill = null; return reload(); }
    const active = b.lines.filter((l) => l.status === 'active');
    right.append(h('h2', {}, b.table_name || b.number, ' ', h('span', { class: 'chip ' + (b.status === 'open' ? 'warn' : 'good') }, b.status)),
      h('table', {}, active.map((l) => h('tr', {}, h('td', {}, l.item_name, l.prepared_at && h('span', { class: 'chip small', style: 'margin-left:.3rem' }, 'prepared')),
        h('td', { class: 'num' }, Number(l.qty)),
        h('td', { class: 'num' }, kes(l.payable)),
        h('td', { class: 'num' }, b.status === 'open' && [
          !l.prepared_at && h('button', { class: 'btn sm', 'aria-label': 'Less', onclick: async () => { if (await act(() => api('PATCH', `/bills/${b.id}/lines/${l.id}`, { qty: String(Number(l.qty) - 1) }))) reload(); } }, '−'), ' ',
          !l.prepared_at && h('button', { class: 'btn sm', 'aria-label': 'More', onclick: async () => { if (await act(() => api('PATCH', `/bills/${b.id}/lines/${l.id}`, { qty: String(Number(l.qty) + 1) }))) reload(); } }, '+'), ' ',
          !l.prepared_at && h('button', { class: 'btn sm', title: 'Kitchen has made it', onclick: async () => { if (await act(() => api('POST', `/bills/${b.id}/lines/${l.id}/prepared`))) reload(); } }, 'Made'), ' ',
          h('button', { class: 'btn sm danger', onclick: () => removeDialog(b, l, reload) }, 'Remove')])))),
      h('table', {}, h('tr', {}, h('td', {}, 'Bill total'), h('td', { class: 'num' }, kes(active.reduce((s, l) => s + l.payable, 0)))), b.payments.map((p) => h('tr', {}, h('td', { class: 'muted' }, 'Paid · ' + p.method), h('td', { class: 'num' }, '−' + kes(p.amount)))), h('tr', { class: 'total' }, h('td', {}, 'Balance'), h('td', { class: 'num' }, kes(b.balance)))));
    if (b.status === 'open') {
      const amt = h('input', { value: (b.balance / 100).toFixed(2), inputmode: 'decimal' }), tip = h('input', { placeholder: 'Tip (optional)', inputmode: 'decimal' });
      const pay = (method) => async () => { const key = uuid(); if (await act(() => api('POST', `/bills/${b.id}/payments`, { method, amount: toCents(amt.value), tip: tip.value ? toCents(tip.value) : 0 }, key), 'Payment recorded')) reload(); };
      right.append(h('div', { class: 'row' }, h('div', {}, h('label', {}, 'Amount received (KES)'), amt), h('div', {}, h('label', {}, 'Tip (KES)'), tip)), h('div', { class: 'row', style: 'margin-top:.5rem' }, ['cash', 'mpesa', 'card'].map((k) => h('button', { class: 'btn primary', onclick: pay(k) }, k === 'mpesa' ? 'M-Pesa' : k[0].toUpperCase() + k.slice(1)))),
        h('div', { class: 'row', style: 'margin-top:.8rem' }, h('button', { class: 'btn', onclick: () => otherPayDialog(b, reload) }, 'Deposit, gift card, points…'), h('button', { class: 'btn', onclick: () => closeDialog(b, reload) }, 'Close without full payment…')),
        h('div', { class: 'row', style: 'margin-top:.5rem' }, h('button', { class: 'btn', onclick: async () => { const p = prompt('Service charge %', '10'); if (p && await act(() => api('POST', `/bills/${b.id}/service-charge`, { percent_bp: Math.round(parseFloat(p) * 100) }), 'Service charge added')) reload(); } }, 'Service charge…'), h('button', { class: 'btn', onclick: async () => { const k = await act(() => api('POST', `/bills/${b.id}/kot`)); if (k) { if (k.lines) printText('Kitchen order', k.text); else toast('Nothing new to send to the kitchen'); reload(); } } }, 'Kitchen ticket'), h('button', { class: 'btn', onclick: () => printReceipt(b.id) }, 'Receipt'), h('button', { class: 'btn danger', onclick: () => voidDialog(b, reload) }, 'Void…')));
    } else if (b.status === 'closed') {
      right.append(h('div', { class: 'row', style: 'margin-top:.8rem' }, h('button', { class: 'btn', onclick: () => printReceipt(b.id) }, 'Print receipt'), b.disposition === 'paid' && h('button', { class: 'btn danger', onclick: () => refundDialog(b, reload) }, 'Refund an item…')));
    }
  }
